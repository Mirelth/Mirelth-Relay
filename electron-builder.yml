# ----------------------------------------------------------------------------
# 代码签名 / 公证占位（拿到证书前无需改动；启用步骤见 docs/SIGNING.md）
# ----------------------------------------------------------------------------
# macOS：Developer ID 证书导入钥匙串后，electron-builder 自动签名。
#       设置 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 后自动公证。
# Windows：CSC_LINK（file://... 或 base64）+ CSC_KEY_PASSWORD 环境变量即可。
#         证书文件放 certs/（已在 .gitignore）。
appId: com.agenttower.app
productName: AgentTower
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**

# ---- Windows ----
win:
  executableName: AgentTower
  # 显式声明 target：默认就是 nsis，写出来便于审计
  target:
    - target: nsis
      arch:
        - x64
  # 启用签名：拿到 .pfx/.p12 后两种方式任选其一
  #   A) 环境变量：CSC_LINK + CSC_KEY_PASSWORD（推荐，CI 友好）
  #   B) 取消下面注释（开发机本地签）
  # certificateFile: certs/agenttower.p12
  # certificateSubjectName: WeiGuangXunTu

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

# ---- macOS ----
mac:
  # 完整 entitlement（含 sandbox=false 等主进程权限），与下面的 inherit 区分
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # hardenedRuntime: true 是 notarize 的前置（notarytool 不收未硬化 runtime）
  hardenedRuntime: true
  gatekeeperAssess: false
  # 公证：默认关，拿到 Apple Developer ID 证书后改成 true
  # 再 export APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  # (electron-builder 26 schema 校验：notarize 必须是 boolean 字面量，
  #  不能用 ${env.X} 因为校验跑在 env 展开之前)
  notarize: false

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}

# ---- Linux ----
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: WeiGuangXunTu
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}

npmRebuild: false
