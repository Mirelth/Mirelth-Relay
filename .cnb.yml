# CNB 云原生构建流水线（Go + Wails 单运行时）
# ============================================================
# verify（push/PR）：Go vet + 单测 + 前端类型检查与构建
# tag_push.build-linux：在 Linux runner 上编译 Wails 二进制（需要 GTK/WebKit2GTK）
#   说明：macOS / Windows 安装包仍需自建 runner 或本地跑 scripts/build-wails.sh，
#   产物上传与版本说明见 docs/RELEASE.md。
# ============================================================

main:
  push:
    - name: verify
      docker:
        image: golang:1.26
      stages:
        - name: Go 检查
          jobs:
            - name: vet
              script: |
                go vet ./...
            - name: test
              script: |
                go test ./...
        - name: 前端检查
          jobs:
            - name: typecheck & build
              image: node:22
              script: |
                cd frontend
                npm ci --registry=https://registry.npmmirror.com
                ./node_modules/.bin/tsc --noEmit -p tsconfig.json
                ./node_modules/.bin/vite build

  pull_request:
    - name: verify-pr
      docker:
        image: golang:1.26
      stages:
        - name: Go 检查
          jobs:
            - name: vet & test
              script: |
                go vet ./...
                go test ./...
        - name: 前端检查
          jobs:
            - name: typecheck
              image: node:22
              script: |
                cd frontend
                npm ci --registry=https://registry.npmmirror.com
                ./node_modules/.bin/tsc --noEmit -p tsconfig.json

  tag_push:
    - name: build-linux
      runner:
        tags: cnb:arch:amd64
      docker:
        image: golang:1.26
      stages:
        - name: 安装 Wails 依赖
          jobs:
            - name: apt
              script: |
                apt-get update
                apt-get install -y --no-install-recommends \
                  libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config nodejs npm
        - name: 构建
          jobs:
            - name: wails build
              script: |
                export PATH="$HOME/go/bin:$PATH"
                go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
                (cd frontend && npm ci --registry=https://registry.npmmirror.com && npm run build)
                wails build -platform linux/amd64 -o relay
        - name: 产物
          jobs:
            - name: 列出构建结果
              script: |
                ls -la build/bin || true
                echo "将 build/bin 下的产物按 docs/RELEASE.md 上传"
