# CNB 云原生构建流水线：类型检查 + 单元测试
# 依赖安装用 --ignore-scripts 跳过 Electron 二进制下载等安装脚本（测试不需要打包链路）
main:
  push:
    - name: verify
      docker:
        image: node:22
      stages:
        - name: 安装依赖
          jobs:
            - name: npm ci
              script: npm ci --ignore-scripts --registry=https://registry.npmmirror.com
        - name: 类型检查与单元测试
          jobs:
            - name: typecheck
              script: npm run typecheck
            - name: test
              script: npm test
  pull_request:
    - name: verify-pr
      docker:
        image: node:22
      stages:
        - name: 安装依赖
          jobs:
            - name: npm ci
              script: npm ci --ignore-scripts --registry=https://registry.npmmirror.com
        - name: 类型检查与单元测试
          jobs:
            - name: typecheck
              script: npm run typecheck
            - name: test
              script: npm test
