# CNB 云原生构建流水线
# ============================================================
# verify（push/PR/api）：node:22 跑 typecheck + test
# tag_push.build-linux：CNB 公开 runner（linux/amd64）跑 electron-builder
#   关键约束：CNB 公开 runner 只有 Linux（cnb:arch:amd64 / arm64:v8），
#   macOS / Windows 没有公开 runner，必须自建 runner 或者开发者本地跑。
#   本仓库未配置自建 mac/win runner，因此 tag_push 阶段只跑 Linux。
#   mac/win 安装包仍由开发者本地跑 npm run build:mac / build:win 产出，
#   然后用 scripts/release.sh 上传（详见 docs/RELEASE.md）。
# 关键 CNB 环境变量（已对照官方文档）：
#   CNB_BRANCH        — tag 名（tag_push 时）
#   CNB_REPO_URL_HTTPS — 仓库 HTTPS 克隆地址
#   CNB_BUILD_WORKSPACE — 工作目录路径
# ============================================================

main:
  push:
    - name: verify
      docker:
        image: node:22
      stages:
        - name: 安装依赖
          jobs:
            - name: npm ci + electron
              # --ignore-scripts 跳过原生模块 rebuild（避免 better-sqlite3 等在 CI 里编译失败），
              # 但 electron 包自己的 postinstall.js 也要跑（下载 electron 二进制），
              # 所以显式调一下 install.js
              script: |
                npm ci --ignore-scripts --registry=https://registry.npmmirror.com
                node node_modules/electron/install.js
        - name: 类型检查与单元测试
          jobs:
            - name: typecheck
              script: npm run typecheck
            - name: test
              script: npm test
  pull_request:
    - name: verify-pr
      docker:
        image: node:22
      stages:
        - name: 安装依赖
          jobs:
            - name: npm ci + electron
              script: |
                npm ci --ignore-scripts --registry=https://registry.npmmirror.com
                node node_modules/electron/install.js
        - name: 类型检查与单元测试
          jobs:
            - name: typecheck
              script: npm run typecheck
            - name: test
              script: npm test
  api_trigger:
    - name: verify-manual
      docker:
        image: node:22
      stages:
        - name: 安装依赖
          jobs:
            - name: npm ci + electron
              script: |
                npm ci --ignore-scripts --registry=https://registry.npmmirror.com
                node node_modules/electron/install.js
        - name: 类型检查与单元测试
          jobs:
            - name: typecheck
              script: npm run typecheck
            - name: test
              script: npm test

  # tag 触发：只跑 Linux 公开 runner（CNB 没有 mac/win 公开 runner）
  # 用 `$:` 而不是 `main:` —— tag 名是 v1.1.1，main: 不会匹配
  # `$:` 是 CNB 的通配符，匹配所有分支和所有 tag 名
$:
  tag_push:
    - name: build-linux
      runner:
        tags: cnb:arch:amd64
      stages:
        - name: checkout & install
          jobs:
            - name: install
              script: |
                # /workspace 是挂载点不能 rm，把仓库 clone 到子目录
                git clone --depth 1 "$CNB_REPO_URL_HTTPS" "$CNB_BUILD_WORKSPACE/repo"
                cd "$CNB_BUILD_WORKSPACE/repo"
                npm ci --ignore-scripts --registry=https://registry.npmmirror.com
                # 显式触发 electron 二进制下载（--ignore-scripts 跳过了 postinstall）
                node node_modules/electron/install.js
        - name: build
          jobs:
            - name: electron-builder
              script: |
                cd "$CNB_BUILD_WORKSPACE/repo"
                export ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
                export ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
                npm run build
                npx electron-builder --linux --publish never
        - name: create release
          type: git:release
          options:
            title: $CNB_BRANCH
            description: "由 CI 自动创建（仅含 Linux 产物，macOS/Windows 由开发者本地补充）"
            latest: false   # 留到 scripts/release.sh 标记 latest
        - name: upload
          image: cnbcool/attachments:latest
          settings:
            tag: $CNB_BRANCH
            attachments:
              - "dist/agent-tower-*.AppImage"
              - "dist/agent-tower-*_amd64.deb"
              - "dist/latest-linux.yml"
